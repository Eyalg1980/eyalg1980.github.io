<!doctype html>

<title>העמוד עבר · Simpla</title>
<script>
/* Old GitHub Pages addresses moved to Vercel on 31.10.2026.
   Any eyalg1980.github.io/<site>/<path> is sent to the same path on the new host. */
(function () {
  var MOVED = {
    'simpla-lab': 'https://lab.simplaux.com',
    'daily-board': 'https://daily-board-swart.vercel.app'
  };
  var m = location.pathname.match(/^\/([^\/]+)(\/.*)?$/);
  if (m && MOVED[m[1]]) {
    location.replace(MOVED[m[1]] + (m[2] || '/') + location.search + location.hash);
  }
})();
</script>

  :root{--bg:#F7F5F0;--ink:#141F3D;--soft:#5F6C8A}

  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);font-family:Rubik,Heebo,-apple-system,sans-serif;text-align:center}
  a{color:inherit}
  p{color:var(--soft)}
</style>
